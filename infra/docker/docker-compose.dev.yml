# Local development database only. Not for production.
name: kalpix-dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: kalpix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kalpix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kalpix_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # bound to localhost only
    volumes:
      - kalpix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kalpix} -d ${POSTGRES_DB:-kalpix_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kalpix_pgdata:
